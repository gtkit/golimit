# golangci-lint v2 schema(Go 1.26+).
# 文档:https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true
  concurrency: 4

linters:
  default: none
  enable:
    # 基础.
    - errcheck
    - govet
    - staticcheck    # 已含 gosimple / stylecheck.
    - ineffassign
    - unused

    # Bug 预防.
    - bodyclose
    - contextcheck
    - durationcheck
    - noctx

    # 代码风格.
    - misspell
    - unconvert
    - unparam
    - revive
    - godot
    - whitespace
    - predeclared
    - nolintlint
    # canonicalheader 不启用 — 本项目使用业界事实标准 X-RateLimit-* 命名,
    # Go textproto canonical 形式 X-Ratelimit-* 反而与 Stripe / GitHub / Twitter 等不一致.

    # 性能.
    - prealloc
    - perfsprint

    # 安全.
    - gosec

    # 复杂度.
    - gocognit
    - cyclop
    - nestif

    # 现代化.
    - copyloopvar
    - intrange
    - exptostd
    - fatcontext
    - usestdlibvars

    # 测试.
    - usetesting
    - tparallel

    # 其他实用.
    - asasalint
    - dupword
    - gocritic
    - nakedret
    - wastedassign
    - mirror

  settings:
    errcheck:
      # 不强制检查 type assertion 的 ok — sync.Map 容器场景下断言保证安全,加 ok 反而冗余.
      check-type-assertions: false
      check-blank: false

    govet:
      enable-all: true
      disable:
        - fieldalignment

    staticcheck:
      checks:
        - all

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    gocognit:
      min-complexity: 25
    cyclop:
      max-complexity: 15
      package-average: 5.0
    nestif:
      min-complexity: 5

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
      disabled-checks:
        - ifElseChain
        - hugeParam
        - rangeValCopy

    nakedret:
      max-func-lines: 20

    gosec:
      excludes:
        - G104  # errcheck 已覆盖.
        - G304  # 文件路径由变量构造(本项目无文件 IO).

    misspell:
      locale: US

    perfsprint:
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true

    godot:
      scope: declarations

    usestdlibvars:
      http-method: true
      http-status-code: true
      time-weekday: true
      time-month: true
      time-layout: true

    usetesting:
      os-setenv: true
      os-temp-dir: true
      context-background: true
      context-todo: true

    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # 测试文件放宽部分严格度.
      - path: _test\.go
        linters:
          - gosec
          - gocritic
          - gocognit
          - cyclop
          - nestif
          - errcheck
          - dupword
          - perfsprint
          - unparam
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
